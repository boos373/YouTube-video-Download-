<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>All‑in‑One Video Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b0f1a 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            background: rgba(20, 26, 40, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            width: 100%;
            max-width: 680px;
            padding: 28px 22px 32px;
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 2.0rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #b3c7ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            font-size: 2.2rem;
        }

        .subhead {
            color: #8f9bb3;
            font-size: 0.95rem;
            margin-bottom: 28px;
            border-left: 3px solid #3b6eff;
            padding-left: 14px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .url-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .url-input-wrapper input {
            width: 100%;
            padding: 18px 20px 18px 52px;
            font-size: 1rem;
            background: #0f1420;
            border: 1.5px solid #2a3247;
            border-radius: 28px;
            color: #f0f4ff;
            outline: none;
            transition: 0.25s;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .url-input-wrapper input:focus {
            border-color: #3b6eff;
            box-shadow: 0 0 0 4px rgba(59, 110, 255, 0.2);
            background: #0b111e;
        }

        .url-input-wrapper input::placeholder {
            color: #5f6b82;
            font-weight: 300;
        }

        .url-icon {
            position: absolute;
            left: 20px;
            font-size: 1.3rem;
            opacity: 0.7;
            color: #7c8bb0;
        }

        .download-btn {
            background: linear-gradient(135deg, #3b6eff 0%, #6d4aff 100%);
            border: none;
            border-radius: 28px;
            padding: 18px 26px;
            font-size: 1.15rem;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 12px 24px -8px rgba(59, 110, 255, 0.5);
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #4b7aff 0%, #7d5cff 100%);
            transform: scale(1.01);
            box-shadow: 0 18px 30px -10px #3b6eff;
        }

        .download-btn:active {
            transform: scale(0.98);
            opacity: 0.95;
        }

        .download-btn:disabled {
            opacity: 0.6;
            transform: none;
            box-shadow: none;
            background: #2e3a55;
            cursor: not-allowed;
        }

        .status-container {
            background: #0d1322;
            border-radius: 28px;
            padding: 16px 20px;
            margin: 24px 0 18px;
            border: 1px solid #1f263a;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #b7c2da;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .status-container .spinner {
            width: 22px;
            height: 22px;
            border: 2.5px solid #2f3b58;
            border-top: 2.5px solid #3b6eff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-area {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .meta-card {
            background: #0f1626;
            border-radius: 24px;
            padding: 18px 20px;
            border: 1px solid #20293f;
        }

        .meta-title {
            color: #dfe7ff;
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-title span {
            color: #6b7fa0;
            font-weight: 400;
            font-size: 0.85rem;
        }

        .meta-desc {
            color: #8e9bb5;
            font-size: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .badge {
            background: #1b2338;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #a8b6d9;
            border: 1px solid #2a3350;
        }

        .media-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 6px;
        }

        .media-item {
            background: #0d1322;
            border-radius: 22px;
            padding: 14px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border: 1px solid #1d253b;
            transition: 0.2s;
        }

        .media-item:hover {
            border-color: #2f4068;
            background: #10182b;
        }

        .media-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 18px;
            flex: 2 1 220px;
        }

        .quality-tag {
            background: #1f2b46;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #b8ccff;
            letter-spacing: 0.2px;
            border: 1px solid #31415f;
            white-space: nowrap;
        }

        .quality-tag.hd {
            background: #1d3b4b;
            color: #8ad0ff;
            border-color: #2e6890;
        }

        .quality-tag.audio {
            background: #2b2b46;
            color: #c7a5ff;
            border-color: #594a8f;
        }

        .size-tag {
            color: #7c8bb0;
            font-size: 0.8rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .download-link {
            background: #1b2942;
            border: 1px solid #31456b;
            color: #d0ddff;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
        }

        .download-link:hover {
            background: #243a60;
            border-color: #5f83c9;
            color: white;
            transform: translateY(-1px);
        }

        .download-link:active {
            transform: translateY(1px);
        }

        .error-message {
            background: rgba(220, 50, 70, 0.15);
            border: 1px solid #b33a4a;
            border-radius: 22px;
            padding: 16px 20px;
            color: #ffb3b8;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .empty-state {
            color: #576179;
            text-align: center;
            padding: 24px 10px;
            font-size: 0.95rem;
            border: 1px dashed #28324b;
            border-radius: 30px;
            background: #0b101c;
        }

        .note {
            margin-top: 22px;
            font-size: 0.72rem;
            color: #4e5a75;
            text-align: center;
            letter-spacing: 0.3px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px 16px 24px;
                border-radius: 32px;
            }
            h1 { font-size: 1.7rem; }
            .url-input-wrapper input { padding: 16px 18px 16px 48px; font-size: 0.95rem; }
            .download-btn { padding: 16px 20px; font-size: 1rem; }
            .media-item { flex-direction: column; align-items: stretch; }
            .download-link { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>⬇️</span> All‑in‑One
        </h1>
        <div class="subhead">TikTok · Instagram · YouTube · Facebook · Twitter</div>

        <div class="input-group">
            <div class="url-input-wrapper">
                <span class="url-icon">🔗</span>
                <input type="url" id="videoUrl" placeholder="https://www.tiktok.com/@user/video/… or any social link" autocomplete="off" autocapitalize="off">
            </div>
            <button class="download-btn" id="fetchBtn">
                <span>⚡</span> Get Download Links
            </button>
        </div>

        <div id="statusBox" class="status-container" style="display: none;">
            <div class="spinner" id="statusSpinner"></div>
            <span id="statusText">Fetching video info…</span>
        </div>

        <div id="resultArea" class="result-area">
            <div class="empty-state">
                ⚡ Paste a link and tap “Get Download Links”
            </div>
        </div>

        <div class="note">
            Custom Downloader · Ready for Backend / API Integration
        </div>
    </div>

    <script>
        (function() {
            // আপনার ব্যাকএন্ড API URL এখানে দিন (যেমন: https://your-backend.onrender.com/api/extract)
            // যে ব্যাকএন্ডটি yt-dlp চালিয়ে নিচের JSON ফরম্যাটে রেসপন্স দেবে:
            // { title, author, source, duration, medias: [{ url, quality, type, extension, data_size }] }
            const BACKEND_API_URL = '/api/extract';

            const videoUrlInput = document.getElementById('videoUrl');
            const fetchBtn = document.getElementById('fetchBtn');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const statusSpinner = document.getElementById('statusSpinner');
            const resultArea = document.getElementById('resultArea');

            function formatBytes(bytes) {
                if (!bytes || bytes === 0) return '';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            }

            function formatDuration(msOrSec) {
                if (!msOrSec) return '';
                // যদি সেকেন্ডে থাকে তবে 1000 দিয়ে গুণ করে ms বানানো যায়, প্রয়োজন অনুযায়ী ঠিক করুন
                const totalSec = msOrSec > 10000 ? Math.floor(msOrSec / 1000) : Math.floor(msOrSec);
                const min = Math.floor(totalSec / 60);
                const sec = totalSec % 60;
                return `${min}:${sec.toString().padStart(2, '0')}`;
            }

            function showEmptyState(message = '⚡ Paste a link and tap “Get Download Links”') {
                resultArea.innerHTML = `<div class="empty-state">${message}</div>`;
            }

            function showError(message) {
                resultArea.innerHTML = `<div class="error-message"><span>❌</span> ${escapeHtml(message)}</div>`;
            }

            function setLoading(isLoading, message = 'Fetching video info…') {
                if (isLoading) {
                    statusBox.style.display = 'flex';
                    statusText.textContent = message;
                    statusSpinner.style.display = 'block';
                    fetchBtn.disabled = true;
                } else {
                    statusBox.style.display = 'none';
                    fetchBtn.disabled = false;
                }
            }

            function renderMedia(data) {
                if (!data || data.error === true) {
                    showError(data?.message || 'Failed to fetch video. Please check the URL.');
                    return;
                }

                const medias = data.medias || [];
                if (!medias.length) {
                    showError('No downloadable media found for this link.');
                    return;
                }

                const title = data.title || 'Untitled';
                const author = data.author || data.unique_id || 'Unknown';
                const source = data.source || 'social';
                const duration = data.duration ? formatDuration(data.duration) : '';

                const metaHtml = `
                    <div class="meta-card">
                        <div class="meta-title">
                            🎬 ${escapeHtml(title)}
                            <span>(${escapeHtml(source)})</span>
                        </div>
                        <div class="meta-desc">
                            <span>👤 ${escapeHtml(author)}</span>
                            ${duration ? `<span>⏱️ ${duration}</span>` : ''}
                            ${data.id ? `<span class="badge">ID: ${escapeHtml(String(data.id).slice(0, 12))}…</span>` : ''}
                        </div>
                    </div>
                `;

                let mediaItemsHtml = '';
                medias.forEach((item) => {
                    const url = item.url;
                    if (!url) return;

                    let quality = item.quality || item.type || 'video';
                    let label = quality;
                    let tagClass = '';
                    if (String(quality).includes('hd') || String(quality).includes('no_watermark') || String(quality).includes('1080')) {
                        tagClass = 'hd';
                    } else if (quality === 'audio' || item.type === 'audio' || item.extension === 'mp3') {
                        tagClass = 'audio';
                        label = '🎵 Audio';
                    } else if (quality === 'watermark') {
                        label = '💧 Watermark';
                    } else if (quality === 'no_watermark') {
                        label = '✨ No Watermark';
                    } else {
                        label = String(quality).replace(/_/g, ' ');
                    }

                    const size = item.data_size ? formatBytes(item.data_size) : '';
                    const extension = item.extension || (item.type === 'audio' ? 'mp3' : 'mp4');
                    const typeIcon = item.type === 'audio' ? '🎧' : '🎥';

                    mediaItemsHtml += `
                        <div class="media-item">
                            <div class="media-info">
                                <span class="quality-tag ${tagClass}">${typeIcon} ${escapeHtml(label)}</span>
                                ${size ? `<span class="size-tag">📦 ${size}</span>` : ''}
                                <span class="size-tag">.${escapeHtml(extension)}</span>
                            </div>
                            <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="download-link">
                                ⬇️ Download
                            </a>
                        </div>
                    `;
                });

                if (!mediaItemsHtml) {
                    showError('No direct download URLs available.');
                    return;
                }

                resultArea.innerHTML = metaHtml + `<div class="media-list">${mediaItemsHtml}</div>`;
            }

            function escapeHtml(unsafe) {
                if (typeof unsafe !== 'string') return unsafe;
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            async function fetchVideoLinks() {
                let url = videoUrlInput.value.trim();
                if (!url) {
                    showError('Please paste a video URL first.');
                    return;
                }

                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }

                setLoading(true, 'Connecting to server…');
                showEmptyState('⏳ Fetching video details…');

                try {
                    const response = await fetch(BACKEND_API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ url: url })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.message || `Server error: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    setLoading(false);
                    renderMedia(data);
                } catch (error) {
                    console.error('Fetch error:', error);
                    setLoading(false);
                    showError(error.message || 'Network or backend error. Please check your server.');
                }
            }

            fetchBtn.addEventListener('click', fetchVideoLinks);

            videoUrlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    fetchVideoLinks();
                }
            });

            window.addEventListener('load', () => {
                videoUrlInput.focus();
            });
        })();
    </script>
</body>
</html>
